# The state's web server in front of Case Assistant (nginx). Security review, 2 Nov 2026.
# Put this file in nginx's http block (for example /etc/nginx/conf.d/case-assistant.conf) and change only:
#   the certificate paths, the folder of the built web app (apps/web/dist), and server_name if one host serves more.
# The core app (port 8080) and the AI gateway (port 8000) must listen on 127.0.0.1 only, so nobody reaches them
# around this server: the core trusts the client address this server forwards (server.forward-headers-strategy).
# tests/e2e/test_https_proxy.py runs this file in a real nginx and checks every header below.

# Plain HTTP only sends the browser to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/case-assistant/tls/fullchain.pem;
    ssl_certificate_key /etc/case-assistant/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # an import file may be up to 16 MB (the core caps every other request at 1 MB itself)
    client_max_body_size 16m;

    # on every answer, also errors ("always"); no location below adds headers of its own, so these are never dropped
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;

    root /srv/case-assistant/web;
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # the client's own address, never one it claims (a header it sent is replaced, not appended to)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;          # the core sends these too; one copy each
        proxy_hide_header X-Content-Type-Options;
    }

    # the AI gateway, without the /ai prefix; a draft can take up to a minute
    location /ai/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
