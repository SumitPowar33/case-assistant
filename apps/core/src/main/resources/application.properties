spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost/caseapp_dev}
spring.datasource.username=${DATABASE_USER:caseapp}
spring.datasource.password=${DATABASE_PASSWORD:caseapp}
spring.flyway.enabled=true
# Signs login tokens (HS256). At least 32 characters; the AI gateway uses the same value. No default on purpose.
auth.secret=${AUTH_SECRET}
server.error.include-message=always
# Behind the state's reverse proxy: the client address is the one it forwards (only from internal addresses; see deploy/)
server.forward-headers-strategy=native
