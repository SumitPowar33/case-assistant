name: ci
on:
  push:
  pull_request:
jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  xlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node packages/xlit/xlit.test.js
  db-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseapp
          POSTGRES_PASSWORD: caseapp
          POSTGRES_DB: caseapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseapp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.3" pytest==8.3.4
      - run: python -m pytest -q apps/core/db-tests
        env:
          DATABASE_URL: postgresql://caseapp:caseapp@localhost/caseapp_test
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.4
      - run: python -m pytest -q packs/tests
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseapp
          POSTGRES_PASSWORD: caseapp
          POSTGRES_DB: caseapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseapp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f apps/core/pom.xml test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
